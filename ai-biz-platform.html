<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AI 비즈니스 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root{--ink:#141C26;--ink2:#4A5665;--ink3:#8791A0;--line:#E3E7EC;--bg:#F1F3F6;--paper:#fff;
--brand:#1E5EFF;--good:#2E7D3A;--warn:#C0392B;--focus:#6B4DE6;--gold:#B07C10}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:Pretendard,-apple-system,'Segoe UI',sans-serif;background:#DDE1E8;color:var(--ink);
font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{max-width:480px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:104px;
position:relative;box-shadow:0 0 40px rgba(0,0,0,.08);overflow-x:hidden}
.screen{padding:20px 16px 12px}
.loading{padding:80px;text-align:center;color:var(--ink3)}

.dashhead{background:linear-gradient(160deg,#1B2635,#141C26);color:#fff;padding:22px 18px 26px;
border-radius:0 0 24px 24px}
.dh-row{display:flex;justify-content:space-between;align-items:center}
.dh-title{font-size:20px;font-weight:800;letter-spacing:-.02em;margin:0}
.dh-sub{font-size:13.5px;color:#93A0B0;margin:3px 0 0}
.streak{font-size:14.5px;font-weight:800;background:rgba(255,255,255,.14);color:#FFD9A8;padding:7px 13px;border-radius:20px}
.kpis{display:flex;gap:8px;margin-top:18px}
.kpi{flex:1;background:rgba(255,255,255,.1);border-radius:14px;padding:12px 6px;text-align:center}
.kpi b{display:block;font-size:23px;font-weight:800;letter-spacing:-.02em}
.kpi span{font-size:12px;color:#9AA6B6}
.kpi.hot b{color:#FF9C8F}

.mission{background:#fff;border-radius:18px;padding:16px 17px;margin:-14px 16px 0;position:relative;
box-shadow:0 6px 20px rgba(20,28,38,.12);z-index:2}
.mission .eyebrow{color:var(--brand)}
.mission h3{margin:4px 0 3px;font-size:18.5px;font-weight:800;letter-spacing:-.01em;line-height:1.4}
.mission .msub{font-size:14px;color:var(--ink3)}
.mission .late{color:var(--warn);font-weight:700}
.mission .go{margin-top:12px;width:100%;min-height:48px;border-radius:12px;border:0;background:var(--ink);
color:#fff;font-size:16px;font-weight:800;font-family:inherit;cursor:pointer}

.h1{font-size:25px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px;line-height:1.35}
.h2{font-size:17px;font-weight:800;margin:24px 0 11px;display:flex;justify-content:space-between;align-items:baseline}
.h2 a{font-size:14px;font-weight:700;color:var(--ink3);text-decoration:none;cursor:pointer}
.soft{color:var(--ink2);font-size:15.5px;margin:0 0 14px;line-height:1.65}
.center{text-align:center}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--ink3);display:block;margin-bottom:5px}

/* 모듈 그리드 */
.mods{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.mod{background:#fff;border:0;border-radius:18px;padding:15px 14px 16px;cursor:pointer;font-family:inherit;
text-align:left;box-shadow:0 2px 8px rgba(20,28,38,.06);display:flex;flex-direction:column;gap:9px;min-height:114px}
.mod .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center}
.mod b{font-size:16px;font-weight:800;letter-spacing:-.01em;display:block}
.mod span{font-size:13px;color:var(--ink3);display:block;margin-top:2px;line-height:1.45}
.mod .badge{position:absolute}
.modwrap{position:relative}
.dot-n{position:absolute;top:11px;right:11px;background:var(--warn);color:#fff;font-size:12px;
font-weight:800;min-width:22px;height:22px;border-radius:11px;display:flex;align-items:center;
justify-content:center;padding:0 6px}

.catgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.catcard{background:#fff;border:0;border-radius:18px;padding:0;overflow:hidden;cursor:pointer;
font-family:inherit;text-align:left;box-shadow:0 2px 8px rgba(20,28,38,.06);display:flex;flex-direction:column}
.catart{height:76px;width:100%;display:block}
.catbody{padding:11px 13px 13px}
.catbody b{display:block;font-size:16px;font-weight:800}
.catbody span{font-size:13px;color:var(--ink3);display:block;margin-top:2px}
.catbody .pend{color:var(--warn);font-weight:700}
.banner{border-radius:20px;overflow:hidden;margin-bottom:16px;position:relative}
.banner-t{position:absolute;left:18px;bottom:14px;color:#fff}
.banner-t b{font-size:22px;font-weight:800;display:block;letter-spacing:-.02em}
.banner-t span{font-size:14px;opacity:.9}

.btn{width:100%;min-height:58px;border-radius:14px;font-size:17.5px;font-weight:800;font-family:inherit;
cursor:pointer;border:0;margin-bottom:10px;padding:13px 18px;display:flex;align-items:center;
justify-content:center;gap:8px;line-height:1.4}
.btn.primary{background:var(--ink);color:#fff}
.btn.primary:disabled{opacity:.45;cursor:default}
.btn.ghost{background:#fff;color:var(--ink2);border:1.5px solid var(--line)}
.btn.record{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(30,94,255,.26)}
.btn.choose{background:#fff;border:2px solid var(--line);flex-direction:column;gap:3px;min-height:82px}
.btn.choose span{font-size:14px;font-weight:600;color:var(--ink3)}
.btn.choose.big{min-height:104px;font-size:20px;border-color:var(--brand);color:var(--brand)}
.btn.chatgo{background:#fff;border:2px solid var(--brand);color:var(--brand);min-height:54px;font-size:16.5px}
.btn-row{display:flex;gap:9px}
.btn-row .btn{margin-bottom:0}

.list{display:flex;flex-direction:column;gap:9px}
.row{display:flex;align-items:stretch;background:#fff;border:0;border-radius:14px;overflow:hidden;
cursor:pointer;font-family:inherit;text-align:left;padding:0;width:100%}
.bar{width:6px;flex:none}
.row-b{padding:14px 13px;flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.row-b b{font-size:16.5px;font-weight:800}
.org{font-size:13.5px;font-weight:600;color:var(--ink3)}
.row-s{font-size:14px;color:var(--ink2)}
.row-s2{font-size:13px;color:var(--ink3)}
.row-s2 .late{color:var(--warn);font-weight:700}
.chev{align-self:center;padding:0 14px;color:var(--ink3);font-size:22px}
.stars{color:#D9A400;font-size:13px;letter-spacing:1px}

.bigcard{background:var(--paper);border-radius:18px;padding:19px 17px;margin-bottom:14px;
box-shadow:0 2px 10px rgba(20,28,38,.06)}
.bigcard.center{text-align:center;padding:30px 20px}
.bigcard.focus{border:2px solid var(--focus)}
.big-emo{font-size:42px;color:var(--good);line-height:1;margin-bottom:10px}
.who{font-size:14.5px;font-weight:700;color:var(--ink2);margin-bottom:6px}
.task-title{font-size:21px;font-weight:800;margin:0 0 9px;letter-spacing:-.02em;line-height:1.4}
.why{font-size:14.5px;color:var(--ink3);font-weight:600}
.why.late{color:var(--warn);font-weight:800}
.script{background:#F4F6F9;border-radius:12px;padding:14px;margin-top:15px}
.script-h{font-size:13px;font-weight:800;color:var(--ink3);margin-bottom:6px}
.script p{margin:0 0 10px;font-size:15.5px;line-height:1.7;color:var(--ink2);white-space:pre-wrap}
.mini{background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:8px 15px;font-size:14px;
font-weight:700;font-family:inherit;cursor:pointer;color:var(--ink)}
.dots{display:flex;gap:7px;align-items:center;margin:12px 0}
.d{width:9px;height:9px;border-radius:50%;background:var(--line)}
.d.on{background:var(--ink)}
.dots-n{margin-left:5px;font-size:13px;color:var(--ink3);font-weight:700}
.back{background:none;border:0;font-size:15.5px;font-weight:700;color:var(--ink2);cursor:pointer;
padding:4px 0 12px;font-family:inherit}
.flowtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.steps{display:flex;gap:6px}
.pick{display:flex;flex-direction:column;gap:9px;margin:14px 0 18px}
.pk{background:#fff;border:2px solid var(--line);border-radius:14px;padding:14px 16px;text-align:left;
cursor:pointer;font-family:inherit;display:flex;flex-direction:column;gap:2px;min-height:64px;justify-content:center}
.pk.on{border-color:var(--ink);background:#F7F9FC}
.pk b{font-size:16.5px;font-weight:800}
.pk span{font-size:13.5px;color:var(--ink3)}
.area{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:16px;
font-family:inherit;line-height:1.7;margin:12px 0;resize:vertical;color:var(--ink);background:#fff}
.area:focus{outline:none;border-color:var(--ink)}
.inp{width:100%;border:2px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;
font-family:inherit;background:#fff;color:var(--ink);margin-bottom:11px}
.inp:focus{outline:none;border-color:var(--ink)}
.err{background:#FDECEA;color:#8E2A25;border-radius:10px;padding:12px 14px;font-size:15px;margin-bottom:10px}
.hintbox{background:#EEF3FF;border-radius:12px;padding:12px 14px;font-size:14.5px;color:#28407F;
line-height:1.6;margin-bottom:12px}
.hintbox b{cursor:pointer;text-decoration:underline}

.dict{background:#fff;border-radius:16px;padding:19px 16px;text-align:center;margin-top:12px;border:2px solid var(--line)}
.dict.live{border-color:var(--warn);background:#FFF9F8}
.micbig{width:92px;height:92px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:36px;
cursor:pointer;box-shadow:0 6px 18px rgba(30,94,255,.3);line-height:1}
.micbig.on{background:var(--warn);box-shadow:0 6px 18px rgba(192,57,43,.32);animation:mic 1.4s infinite}
@keyframes mic{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@media(prefers-reduced-motion:reduce){.micbig.on{animation:none}}
.dict-t{font-size:18px;font-weight:800;margin-top:12px}
.dict-s{font-size:14px;color:var(--ink3);margin-top:4px;line-height:1.55}
.dict-s.live{color:var(--warn);font-weight:700}
.wave{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:24px;margin-top:11px}
.wave i{width:5px;background:var(--warn);border-radius:3px;animation:wv .9s infinite ease-in-out}
.wave i:nth-child(2){animation-delay:.1s}.wave i:nth-child(3){animation-delay:.2s}
.wave i:nth-child(4){animation-delay:.3s}.wave i:nth-child(5){animation-delay:.4s}
.wave i:nth-child(6){animation-delay:.5s}
@keyframes wv{0%,100%{height:7px}50%{height:22px}}
@media(prefers-reduced-motion:reduce){.wave i{animation:none;height:14px}}
.interim{font-size:15px;color:var(--ink2);margin-top:10px;line-height:1.6;font-style:italic;
background:#F4F6F9;border-radius:10px;padding:10px 12px;text-align:left}
.micbtn{width:50px;height:50px;border-radius:50%;border:2px solid var(--line);background:#fff;
font-size:20px;cursor:pointer;flex:none;line-height:1}
.micbtn.on{background:var(--warn);border-color:var(--warn);color:#fff;animation:mic 1.4s infinite}
.speak{background:none;border:0;font-size:13.5px;font-weight:700;color:var(--ink3);cursor:pointer;
font-family:inherit;padding:6px 0;text-decoration:underline}
.speakrow{display:flex;justify-content:flex-end;margin:-4px 0 10px}

.summary{font-size:17px;line-height:1.75;margin:0;font-weight:600}
.summary.sm{font-size:15px;font-weight:500;margin:5px 0}
.found{background:#F4F6F9;border-radius:12px;padding:13px 15px;margin-top:14px;font-size:15px;line-height:1.7}
.coach{background:#fff;border-radius:16px;padding:16px 18px;margin-bottom:11px;border-left:6px solid}
.coach .ch{font-size:14px;font-weight:800;margin-bottom:6px}
.coach p{margin:0;font-size:16.5px;line-height:1.7;color:var(--ink2)}
.c-good{border-color:var(--good)} .c-good .ch{color:var(--good)}
.c-miss{border-color:#E08A00} .c-miss .ch{color:#B36B00}
.c-say{border-color:var(--brand)} .c-say .ch{color:var(--brand)}
.c-pat{border-color:var(--focus)} .c-pat .ch{color:var(--focus)}
.quote{font-weight:700;color:var(--ink)!important}
.offline{display:inline-block;font-size:12px;font-weight:700;background:#F0F2F5;color:var(--ink3);
padding:4px 10px;border-radius:20px;margin-bottom:10px}
.done{text-align:center;padding:50px 20px}
.focusbox{background:#fff;border:2px solid var(--focus);border-radius:16px;padding:16px;margin:18px 0;
display:flex;flex-direction:column;gap:3px}
.focusbox b{font-size:18px}
.mini-card{background:#fff;border-radius:13px;padding:13px 14px;margin-bottom:9px;display:flex;
flex-direction:column;gap:3px}
.mini-card b{font-size:15.5px}
.mini-card>span{font-size:13.5px;color:var(--ink3)}
.tiny{font-size:14px;color:var(--ink2);line-height:1.6;margin-top:2px}
.tiny.miss{color:#B36B00}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border:0}
.kv>span{color:var(--ink3);flex:none;width:100px;font-weight:600}
.kv b.warn{color:var(--warn)}
.statrow{display:flex;gap:9px;margin-bottom:16px}
.st{flex:1;background:#fff;border-radius:14px;padding:14px 6px;text-align:center}
.st b{display:block;font-size:22px;font-weight:800}
.st span{font-size:12.5px;color:var(--ink3)}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tag{font-size:14.5px;font-weight:700;border-radius:20px;padding:7px 13px}
.tag i{font-style:normal;opacity:.65;font-size:13px}
.tag.good{background:#E6F4E9;color:var(--good)}
.tag.bad{background:#FFF3E0;color:#A85F00}
.blank{text-align:center;padding:38px 20px;color:var(--ink3);font-size:15px;line-height:1.7}

/* 채팅 */
.chatwrap{display:flex;flex-direction:column;height:100vh;max-height:100vh}
.chathead{background:#fff;border-bottom:1px solid var(--line);padding:13px 15px;display:flex;
align-items:center;gap:11px;flex:none}
.chathead .ci{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
color:#fff;font-weight:800;font-size:15px;flex:none}
.chathead b{display:block;font-size:16px;font-weight:800}
.chathead span{font-size:12.5px;color:var(--ink3)}
.chatlog{flex:1;overflow-y:auto;padding:15px 13px 8px;display:flex;flex-direction:column;gap:11px}
.bub{max-width:85%;padding:12px 14px;border-radius:16px;font-size:15.5px;line-height:1.68;white-space:pre-wrap}
.bub.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:5px}
.bub.ai{align-self:flex-start;background:#fff;color:var(--ink);border-bottom-left-radius:5px;
box-shadow:0 1px 4px rgba(20,28,38,.07);cursor:pointer}
.bub.think{color:var(--ink3);font-style:italic}
.chips{display:flex;gap:7px;overflow-x:auto;padding:8px 13px;flex:none;background:var(--bg)}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:20px;padding:8px 13px;font-size:14px;
font-weight:700;white-space:nowrap;cursor:pointer;font-family:inherit;color:var(--ink2);flex:none}
.chatbar{display:flex;gap:8px;padding:10px 13px 16px;background:var(--bg);flex:none;align-items:flex-end}
.chatin{flex:1;border:2px solid var(--line);border-radius:20px;padding:12px 15px;font-size:16px;
font-family:inherit;resize:none;max-height:110px;line-height:1.5;background:#fff}
.chatin:focus{outline:none;border-color:var(--ink)}
.send{width:50px;height:50px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:19px;
cursor:pointer;flex:none}
.send:disabled{opacity:.35}

/* 교육센터 */
.track{background:#fff;border-radius:16px;margin-bottom:11px;overflow:hidden}
.track-h{display:flex;align-items:center;gap:12px;padding:15px 15px;cursor:pointer}
.track-ic{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;
font-size:19px;flex:none}
.track-h b{font-size:16.5px;font-weight:800;display:block}
.track-h span{font-size:13px;color:var(--ink3)}
.prog{height:7px;background:#EEF1F5;border-radius:4px;overflow:hidden;margin-top:6px;width:100%}
.prog i{display:block;height:100%;border-radius:4px}
.lesson{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-top:1px solid var(--line);
cursor:pointer}
.lesson .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;
display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;margin-top:2px}
.lesson .ck.on{background:var(--good);border-color:var(--good)}
.lesson b{font-size:15.5px;font-weight:700;display:block}
.lesson span{font-size:13.5px;color:var(--ink3)}
.point{display:flex;gap:9px;font-size:15.5px;line-height:1.7;color:var(--ink2);margin-bottom:9px}
.point b{color:var(--brand);flex:none;font-weight:800}

/* 리더 */
.mem{background:#fff;border-radius:14px;padding:14px 15px;margin-bottom:9px}
.mem-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mem-top b{font-size:16.5px;font-weight:800}
.pill{font-size:12.5px;font-weight:800;border-radius:20px;padding:4px 10px}
.pill.hot{background:#FFF3E0;color:#A85F00}
.pill.cold{background:#FDECEA;color:#8E2A25}
.pill.ok{background:#E6F4E9;color:var(--good)}
.pill.cand{background:#EEEAFF;color:var(--focus)}
.mem-s{font-size:13.5px;color:var(--ink3);margin-top:5px}
.mem-bars{display:flex;gap:8px;margin-top:9px}
.mem-bars>div{flex:1}
.mem-bars span{font-size:11.5px;color:var(--ink3);display:block;margin-bottom:3px}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 14px;z-index:40}
.tb{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;
font-size:12.5px;font-weight:700;color:var(--ink3);cursor:pointer;font-family:inherit;padding:5px 0}
.tb.on{color:var(--ink)}
.tb-i{font-size:20px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;
font-size:15px;font-weight:700;padding:12px 20px;border-radius:12px;z-index:60;
box-shadow:0 6px 22px rgba(20,28,38,.3);max-width:88vw;text-align:center}
.resetbtn{background:none;border:0;color:var(--ink3);font-size:13px;font-family:inherit;cursor:pointer;
text-decoration:underline;padding:8px;display:block;margin:20px auto 0}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;

/* ===================== 상수 ===================== */
const CATS={
  mineral:{label:"오륜미네랄",color:"#0E7C86",c2:"#14B8A6",cycle:3},
  health:{label:"건강",color:"#3F7D34",c2:"#7CB342",cycle:5},
  aicoach:{label:"AI코칭",color:"#5B3FD6",c2:"#8B7BF0",cycle:7},
  chain:{label:"블록체인",color:"#B07C10",c2:"#E0A93C",cycle:4},
};
const CATKEYS=Object.keys(CATS);
const STAGES=[{key:"lead",label:"아직 안 만난 분"},{key:"consult",label:"이야기 나누는 중"},
 {key:"proposal",label:"제안 드린 상태"},{key:"nego",label:"조건 조율 중"},{key:"won",label:"계약했어요"}];
const KEY="ai-biz-platform-v1", FOCUS_THRESHOLD=3;

/* 교육센터 커리큘럼 */
const TRACKS=[

const mem={};

  async get(k){ if(window.storage&&window.storage.get){try{const r=await window.storage.get(k);return r?r.value:null;}catch{return null;}}
    try{return localStorage.getItem(k);}catch{return mem[k]||null;} },
  async set(k,v){ if(window.storage&&window.storage.set){try{await window.storage.set(k,v);return;}catch{}}

};

function bump(list,inc){ const out=(list||[]).map(x=>({...x}));
  (inc||[]).forEach(tag=>{ if(typeof tag!=="string")return; const t=tag.trim(); if(!t)return;
    const f=out.find(x=>x.tag===t); if(f){f.count+=1;f.last=today();} else out.push({tag:t,count:1,last:today()}); });
  return out; }
function score(t,c){ const late=gapDays(t.dueDate,today());
  let s=late>0?100+late*6:late===0?90:late>=-2?55:20;
  if(t.kind==="promise")s+=25; if(c){s+=(c.interest||3)*4; if(c.stage==="nego")s+=15; if(c.stage==="proposal")s+=8;}
  return {s,late,why:late>0?`${late}일 지났어요`:late===0?"오늘까지예요":`${-late}일 뒤예요`}; }

/* ============ 음성 ============ */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function useDictation(apply){
  const [on,setOn]=useState(false),[interim,setInterim]=useState(""),[err,setErr]=useState("");
  const ref=useRef(null),base=useRef(""),want=useRef(false),fin=useRef("");
  const start=baseText=>{
    if(!SR){setErr("이 브라우저는 음성 인식을 지원하지 않아요. 크롬(Chrome)으로 열어보세요.");return;}
    base.current=baseText?baseText.trim()+" ":""; fin.current=""; want.current=true; setErr("");
    const x=new SR(); x.lang="ko-KR"; x.continuous=true; x.interimResults=true;
    x.onresult=e=>{ let itm="";
      for(let i=e.resultIndex;i<e.results.length;i++){ const t=e.results[i][0].transcript;
        if(e.results[i].isFinal) fin.current+=t; else itm+=t; }
      setInterim(itm); apply(base.current+fin.current+itm); };
    x.onerror=ev=>{ if(ev.error==="no-speech")return; want.current=false; setOn(false);
      setErr(ev.error==="not-allowed"?"마이크 사용을 허용해 주세요.":"잘 안 들렸어요. 다시 눌러주세요."); };
    x.onend=()=>{ if(want.current){try{x.start();}catch{}} else {setOn(false);setInterim("");} };
    try{ x.start(); ref.current=x; setOn(true); }catch{ setErr("음성 인식을 시작하지 못했어요."); }
  };
  const stop=()=>{ want.current=false; if(ref.current)ref.current.stop(); setOn(false); setInterim(""); };
  useEffect(()=>()=>{want.current=false; if(ref.current){try{ref.current.stop();}catch{}}},[]);
  return {on,interim,err,supported:!!SR,start,stop};
}
function speak(t){ try{ if(!window.speechSynthesis)return; window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang="ko-KR"; u.rate=.95; window.speechSynthesis.speak(u);}catch{} }

async function askClaude(prompt,history){
  const msgs=(history||[]).concat([{role:"user",content:prompt}]);
  const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1200,messages:msgs})});
  if(!r.ok) throw new Error("api");
  const j=await r.json();
  return j.content.map(i=>i.text||"").join("");
}

/* ========================= 앱 ========================= */
function App(){
  const [db,setDb]=useState(null);
  const [view,setView]=useState({n:"dash"});
  const [toast,setToast]=useState("");
  useEffect(()=>{store.get(KEY).then(v=>{let d=null;try{d=v?JSON.parse(v):null;}catch{};setDb(d?{...emptyState(),...d}:emptyState());});},[]);
  const save=n=>{setDb(n);store.set(KEY,JSON.stringify(n));};
  const notify=m=>{setToast(m);setTimeout(()=>setToast(""),2600);};
  if(!db) return <div className="app"><div className="loading">잠시만요…</div></div>;

  const commit=({customerId,rawText,summary,result,mode})=>{
    let customers=db.customers.map(c=>({...c})); let cid=customerId;
    const ex=result.customer||{};
    if(!cid&&ex.name){ cid=uid();
      customers.push({id:cid,name:ex.name,org:ex.org||"",contact:ex.contact||"",
        category:ex.category||"mineral",stage:ex.stage||"consult",orgSize:ex.orgSize||"",
        decisionMaker:ex.decisionMaker||"",interest:3,lastContact:today(),
        cares:bump([],result.cares),objections:bump([],result.objections),works:bump([],result.works)});
    } else if(cid){ customers=customers.map(c=>{ if(c.id!==cid)return c; const n={...c};
      if(ex.contact&&!n.contact)n.contact=ex.contact; if(ex.org&&!n.org)n.org=ex.org;
      if(ex.orgSize)n.orgSize=ex.orgSize; if(ex.decisionMaker)n.decisionMaker=ex.decisionMaker;
      if(ex.stage)n.stage=ex.stage; n.lastContact=today();
      n.cares=bump(n.cares,result.cares);n.objections=bump(n.objections,result.objections);
      n.works=bump(n.works,result.works); return n; }); }
    const strengths=bump(db.growth.strengths,result.strengthTags);
    let weaknesses=bump(db.growth.weaknesses,result.weaknessTags);
    const top=weaknesses.filter(w=>w.count>=FOCUS_THRESHOLD).sort((a,b)=>b.count-a.count)[0];
    weaknesses=weaknesses.map(w=>({...w,focus:top?w.tag===top.tag:false}));
    const last=db.user.lastRecord; let streak=db.user.streak;
    if(last!==today()) streak=(last&&gapDays(last,today())===1)?streak+1:1;
    const rec={id:uid(),customerId:cid,date:today(),mode,rawText,summary,praise:result.praise,
      miss:result.miss,betterScript:result.betterScript,pattern:result.pattern||""};
    const tasks=(result.tasks||[]).map(t=>({id:uid(),customerId:cid,title:t.title,script:t.script||"",
      channel:t.channel||"전화",kind:t.kind||"followup",dueDate:addDays(today(),t.days==null?1:t.days),done:false}));
    save({...db,user:{...db.user,streak,lastRecord:today()},growth:{strengths,weaknesses},customers,
      records:[rec,...db.records],tasks:[...db.tasks,...tasks]});
    return {streak,taskCount:tasks.length,focus:top};
  };

  const nav=v=>setView(v);
  const showTabs=["dash","tasks","people","me"].includes(view.n);
  const P={db,save,notify,nav};
  let body;
  switch(view.n){
    case "dash": body=<Dash {...P}/>;break;
    case "cat": body=<CatView {...P} k={view.k}/>;break;
    case "cust": body=<CustView {...P} id={view.id}/>;break;
    case "chat": body=<Chat {...P} id={view.id}/>;break;
    case "record": body=<RecordFlow db={db} commit={commit} nav={nav}/>;break;
    case "tasks": body=<Tasks {...P}/>;break;
    case "people": body=<People {...P}/>;break;
    case "learn": body=<Learn {...P} track={view.track}/>;break;
    case "content": body=<Content {...P}/>;break;
    case "leader": body=<Leader {...P}/>;break;
    default: body=<Me {...P} reset={()=>{if(confirm("모든 기록을 지울까요?"))save(emptyState());}}/>;
  }
  return (<div className="app">
    {body}
    {showTabs&&(<nav className="tabbar">
      {[["dash","홈","▦"],["tasks","미션","✓"],["people","고객","👥"],["me","나","📈"]].map(([k,l,i])=>(
        <button key={k} className={view.n===k?"tb on":"tb"} onClick={()=>nav({n:k})}>
          <span className="tb-i">{i}</span><span>{l}</span></button>))}
    </nav>)}
    {toast&&<div className="toast">{toast}</div>}
  </div>);
}

            onClick={()=>setInterest(n)}>★</button>)}</div></div>
      <div style={{marginTop:14}}><span className="eyebrow">진행 단계</span>

            onClick={()=>setStage(s.key)}>{s.label}</button>)}</div></div>
    </div>

    {(c.decisionMaker||(c.cares||[]).length||(c.objections||[]).length||(c.works||[]).length||c.contact)?(
      <div className="bigcard"><span className="eyebrow">이 분에 대해 알게 된 것</span>
        {c.contact&&<L t="연락처" v={c.contact}/>}
        {c.decisionMaker&&<L t="결정하시는 분" v={c.decisionMaker}/>}
        {c.orgSize&&<L t="규모" v={c.orgSize}/>}
        {(c.cares||[]).length>0&&<L t="신경 쓰시는 것" v={list(c.cares)}/>}
        {(c.objections||[]).length>0&&<L t="망설이시는 이유" v={list(c.objections)} warn/>}
        {(c.works||[]).length>0&&<L t="통했던 방식" v={list(c.works)}/>}
      </div>):null}

    {tasks.length>0&&(<React.Fragment><div className="h2">팔로업</div>
      {tasks.map(t=><div className="mini-card" key={t.id}><b>{t.title}</b><span>{fmt(t.dueDate)} · {t.channel}</span></div>)}</React.Fragment>)}

    {recs.map(r=>(<div className="mini-card" key={r.id}>
      <span className="row-s2">{fmt(r.date)}</span><p className="summary sm">{r.summary}</p>

    {recs.length===0&&<div className="blank">기록이 없어요.</div>}
  </div>);
}

/* ======================= AI 코치 (채팅) ======================= */
const GEN_CHIPS=["오늘 뭐부터 할까요?","제품 설명 쉽게 알려주세요","SNS에 뭘 올릴까요?","신입을 어떻게 도울까요?","거절당했어요"];
const CUS_CHIPS=["지금 뭐라고 답할까요?","다음에 뭘 해야 하나요?","거절당했어요","가격을 깎아달래요","연락이 없어요"];
function Chat({db,save,id,nav}){
  const c=id?db.customers.find(x=>x.id===id):null;
  const key=id||"general";
  const cat=CATS[(c&&c.category)||"aicoach"];
  const [msgs,setMsgs]=useState((db.chats&&db.chats[key])||[]);
  const [text,setText]=useState(""); const [busy,setBusy]=useState(false);
  const dict=useDictation(setText);
  const logRef=useRef(null);
  useEffect(()=>{if(logRef.current)logRef.current.scrollTop=logRef.current.scrollHeight;},[msgs,busy]);
  const persist=l=>{setMsgs(l);save({...db,chats:{...(db.chats||{}),[key]:l}});};
  const send=async q=>{
    const question=(q||text).trim(); if(!question||busy)return;
    if(dict.on)dict.stop();
    const next=[...msgs,{role:"user",content:question}]; persist(next); setText(""); setBusy(true);
    const weak=db.growth.weaknesses.filter(w=>w.count>=2).map(w=>`${w.tag}(${w.count}회)`).join(", ")||"없음";
    let ctx;
    if(c){ const recs=db.records.filter(r=>r.customerId===id).slice(0,5).map(r=>`- ${r.date}: ${r.summary}`).join("\n")||"없음";
      ctx=`[고객] ${c.name} (${c.org||"소속 미상"}) · ${CATS[c.category].label} · ${stageLabel(c.stage)}
[결정하시는 분] ${c.decisionMaker||"확인 안 됨"}
[신경 쓰는 것] ${(c.cares||[]).map(o=>o.tag).join(", ")||"없음"}
[망설인 이유] ${(c.objections||[]).map(o=>`${o.tag}(${o.count}회)`).join(", ")||"없음"}
[지난 기록]\n${recs}`;
    } else {
      ctx=`[사용자 현황] 고객 ${db.customers.length}명 · 미완료 미션 ${db.tasks.filter(t=>!t.done).length}건 · 교육 ${db.learned.length}/${LESSON_TOTAL}과 이수
[다루는 분야] 오륜미네랄(미네랄 보충제), 건강, AI코칭·교육, 블록체인`;
    }
    const sys=`당신은 한국 영업·사업 코치입니다. 사용자는 나이가 있을 수 있으니 쉬운 말로, 존댓말로, 짧게 답하세요.
답변은 4~7줄 이내. 실제로 쓸 수 있는 멘트는 따옴표로 감싸 제시하세요. 설교하지 말고 바로 쓸 수 있게 주세요.
건강기능식품이므로 질병 치료·예방을 단정하는 표현은 절대 쓰지 마세요.

${ctx}
[사용자가 반복해온 약점] ${weak}

사용자 질문: ${question}`;
    try{ const hist=msgs.slice(-6).map(m=>({role:m.role,content:m.content}));
      persist([...next,{role:"assistant",content:(await askClaude(sys,hist)).trim()}]);
    }catch{ persist([...next,{role:"assistant",content:offlineChat(question,c)}]); }
    finally{setBusy(false);}
  };
  const chips=c?CUS_CHIPS:GEN_CHIPS;
  return (<div className="chatwrap">
    <div className="chathead">
      <button className="back" style={{padding:0}} onClick={()=>nav(c?{n:"cust",id}:{n:"dash"})}>←</button>
      <span className="ci" style={{background:cat.color}}>{c?c.name.slice(0,1):"AI"}</span>
      <div><b>{c?`${c.name} 대응 코치`:"AI 코치"}</b>
        <span>{c?`${CATS[c.category].label} · ${stageLabel(c.stage)}`:"제품 · 사업 · SNS 무엇이든"}</span></div>
    </div>
    <div className="chatlog" ref={logRef}>
      {msgs.length===0&&(<div className="bub ai">
        {c?`${c.name}님 건으로 무엇이든 물어보세요.\n\n고객이 한 말을 그대로 알려주시면 어떻게 답할지 문장으로 만들어 드릴게요.`
          :"무엇이든 물어보세요.\n\n제품 설명, 사업 방법, SNS 글, 신입 관리까지 도와드립니다.\n말로 물어보셔도 됩니다."}</div>)}
      {msgs.map((m,i)=>(<div key={i} className={m.role==="user"?"bub me":"bub ai"}
        onClick={()=>m.role==="assistant"&&speak(m.content)}>{m.content}</div>))}
      {busy&&<div className="bub ai think">코치가 생각하는 중이에요…</div>}
    </div>
    {dict.on&&dict.interim&&<div className="interim" style={{margin:"0 13px"}}>{dict.interim}</div>}
    {dict.err&&<div className="err" style={{margin:"0 13px 8px"}}>{dict.err}</div>}
    <div className="chips">{chips.map(ch=><button className="chip" key={ch} onClick={()=>send(ch)}>{ch}</button>)}</div>
    <div className="chatbar">
      <button className={dict.on?"micbtn on":"micbtn"} onClick={()=>dict.on?dict.stop():dict.start(text)}>{dict.on?"■":"🎙"}</button>
      <textarea className="chatin" rows={1} value={text} placeholder={dict.on?"듣고 있어요…":"무엇이든 물어보세요"}
        onChange={e=>setText(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}/>
      <button className="send" onClick={()=>send()} disabled={busy||!text.trim()}>↑</button>
    </div>
  </div>);
}

/* ======================= 콘텐츠 생성 ======================= */
const KINDS=[{k:"sns",t:"SNS 게시글",s:"인스타·블로그에 올릴 글",ic:"📱"},
 {k:"kakao",t:"카톡 메시지",s:"고객에게 보낼 메시지",ic:"💛"},
 {k:"edu",t:"교육자료",s:"팀에게 나눠줄 자료",ic:"📄"}];
function Content({db,save,nav,notify}){
  const [step,setStep]=useState(1);
  const [kind,setKind]=useState("sns");
  const [topic,setTopic]=useState("");
  const [target,setTarget]=useState("40~50대 직장인");
  const [out,setOut]=useState(""); const [busy,setBusy]=useState(false); const [off,setOff]=useState(false);
  const dict=useDictation(setTopic);
  const gen=async()=>{
    if(!topic.trim()){notify("주제를 적어주세요");return;}
    setBusy(true); setOff(false);
    const kt=KINDS.find(x=>x.k===kind).t;
    const rule=kind==="sns"?"200~350자. 첫 줄이 눈길을 끌어야 합니다. 해시태그 3~5개를 마지막에."
      :kind==="kakao"?"3~5줄. 부담스럽지 않게, 강요 없이. 이모지는 최대 1개."
      :"제목과 3개 항목으로 구성. 각 항목은 핵심 2~3줄. 마지막에 '오늘 해볼 것' 한 줄.";
    const prompt=`당신은 한국의 건강식품·사업 분야 콘텐츠 작가입니다. ${kt}을 하나 써주세요.

주제: ${topic}
읽는 사람: ${target}
형식 규칙: ${rule}

중요:
- 질병 치료·예방을 단정하는 표현은 절대 쓰지 마세요 (건강기능식품 광고 규정).
- 과장된 효과 약속 금지. 경험을 나누는 어조로.
- 설명 없이 본문만 출력하세요.`;
    try{ setOut((await askClaude(prompt)).trim()); }
    catch{ setOut(offlineContent(kind,topic,target)); setOff(true); }
    finally{ setBusy(false); setStep(3); }
  };
  return (<div className="screen">
    <button className="back" onClick={()=>step===1?nav({n:"dash"}):setStep(step-1)}>← {step===1?"홈":"뒤로"}</button>
    {step===1&&(<React.Fragment>
      <h1 className="h1">무엇을 만들까요?</h1>
      <p className="soft">AI가 초안을 만들어 드려요. 고쳐서 쓰시면 됩니다.</p>
      {KINDS.map(x=><button className="pk" key={x.k} style={{marginBottom:10,flexDirection:"row",alignItems:"center",gap:13}}
        onClick={()=>{setKind(x.k);setStep(2);}}>
        <span style={{fontSize:26}}>{x.ic}</span><span><b>{x.t}</b><span style={{display:"block"}}>{x.s}</span></span>
      </button>)}
    </React.Fragment>)}
    {step===2&&(<React.Fragment>
      <h1 className="h1">어떤 내용인가요?</h1>
      <span className="eyebrow">주제</span>
      <input className="inp" value={topic} onChange={e=>setTopic(e.target.value)}
        placeholder="예) 아침에 미네랄 챙겨 먹은 3개월 후기"/>
      <button className={dict.on?"btn ghost":"btn ghost"} style={dict.on?{borderColor:"#C0392B",color:"#C0392B"}:{}}
        onClick={()=>dict.on?dict.stop():dict.start(topic)}>{dict.on?"■ 듣는 중… 누르면 멈춰요":"🎙 말로 입력하기"}</button>
      {dict.interim&&<div className="interim">{dict.interim}</div>}
      <span className="eyebrow" style={{marginTop:8}}>읽는 사람</span>
      <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:16}}>
        {["40~50대 직장인","60대 이상","젊은 엄마","사업 관심자","기존 고객"].map(t=>
          <button className="chip" key={t} style={target===t?{background:"#141C26",color:"#fff",borderColor:"#141C26"}:{}}
            onClick={()=>setTarget(t)}>{t}</button>)}
      </div>
      <button className="btn primary" onClick={gen} disabled={busy}>{busy?"만드는 중이에요…":"만들기"}</button>
    </React.Fragment>)}
    {step===3&&(<React.Fragment>
      <h1 className="h1">{KINDS.find(x=>x.k===kind).t}</h1>
      {off&&<span className="offline">간단 생성 모드</span>}
      <div className="bigcard"><p style={{whiteSpace:"pre-wrap",margin:0,fontSize:16,lineHeight:1.8}}>{out}</p></div>
      <div className="hintbox">그대로 올리면 티가 나요. <b style={{textDecoration:"none"}}>내 경험 한 줄</b>을 꼭 넣어 고쳐 쓰세요.</div>
      <button className="btn primary" onClick={()=>{if(navigator.clipboard)navigator.clipboard.writeText(out);notify("복사했어요");}}>복사하기</button>
      <div className="btn-row">
        <button className="btn ghost" onClick={gen} disabled={busy}>다시 만들기</button>
        <button className="btn ghost" onClick={()=>{save({...db,contents:[{id:uid(),kind,topic,target,out,date:today()},...db.contents]});notify("저장했어요");}}>저장</button>
      </div>
      {db.contents.length>0&&(<React.Fragment><div className="h2">저장한 콘텐츠</div>
        {db.contents.slice(0,5).map(x=><div className="mini-card" key={x.id}>
          <b>{x.topic}</b><span>{KINDS.find(k=>k.k===x.kind).t} · {fmt(x.date)}</span></div>)}
      </React.Fragment>)}
    </React.Fragment>)}
  </div>);
}

/* ======================= 교육센터 ======================= */
function Learn({db,save,nav,notify}){
  const [open,setOpen]=useState(null);
  const [lesson,setLesson]=useState(null);
  const doneSet=new Set(db.learned);
  const toggle=lid=>{ const has=doneSet.has(lid);
    save({...db,learned:has?db.learned.filter(x=>x!==lid):[...db.learned,lid]});
    notify(has?"완료를 취소했어요":"완료했어요! 👏"); };
  if(lesson){
    const tr=TRACKS.find(t=>t.lessons.some(l=>l.id===lesson));
    const ls=tr.lessons.find(l=>l.id===lesson);
    const done=doneSet.has(ls.id);
    return (<div className="screen">
      <button className="back" onClick={()=>setLesson(null)}>← {tr.name}</button>
      <h1 className="h1">{ls.t}</h1>
      <p className="soft">{ls.d}</p>
      <div className="speakrow"><button className="speak" onClick={()=>speak(`${ls.t}. ${ls.p.join(" ")}`)}>🔊 읽어주기</button></div>
      <div className="bigcard">
        {ls.p.map((p,i)=><div className="point" key={i}><b>{i+1}</b><span>{p}</span></div>)}
      </div>
      <div className="bigcard" style={{background:tr.bg}}>
        <span className="eyebrow">오늘 해볼 것</span>
        <div style={{fontSize:16.5,fontWeight:700,lineHeight:1.6}}>{ls.x}</div>
      </div>
      <button className="btn primary" onClick={()=>{toggle(ls.id);setLesson(null);}}>
        {done?"완료 취소":"다 배웠어요"}</button>
      <button className="btn chatgo" onClick={()=>nav({n:"chat"})}>💬 이 내용 코치에게 더 물어보기</button>
    </div>);
  }
  return (<div className="screen">
    <button className="back" onClick={()=>nav({n:"dash"})}>← 홈</button>
    <h1 className="h1">교육센터</h1>
    <p className="soft">{db.learned.length}과 완료 · 전체 {LESSON_TOTAL}과</p>
    <div className="prog" style={{marginBottom:18}}>
      <i style={{width:`${db.learned.length/LESSON_TOTAL*100}%`,background:"#1E5EFF"}}/></div>
    {TRACKS.map(tr=>{ const n=tr.lessons.filter(l=>doneSet.has(l.id)).length;
      return (<div className="track" key={tr.id}>
        <div className="track-h" onClick={()=>setOpen(open===tr.id?null:tr.id)}>
          <span className="track-ic" style={{background:tr.bg}}>{tr.icon}</span>
          <div style={{flex:1}}><b>{tr.name}</b>
            <span>{n} / {tr.lessons.length}과 완료</span>
            <span className="prog"><i style={{width:`${n/tr.lessons.length*100}%`,background:tr.color}}/></span></div>
          <span className="chev" style={{padding:0}}>{open===tr.id?"⌃":"›"}</span>
        </div>
        {open===tr.id&&tr.lessons.map(l=>(
          <div className="lesson" key={l.id} onClick={()=>setLesson(l.id)}>
            <span className={doneSet.has(l.id)?"ck on":"ck"}>{doneSet.has(l.id)?"✓":""}</span>
            <span style={{flex:1}}><b>{l.t}</b><span>{l.d}</span></span>
            <span className="chev" style={{padding:0}}>›</span>
          </div>))}
      </div>);})}
  </div>);
}

    <button className="back" onClick={()=>nav({n:"dash"})}>← 홈</button>
    <h1 className="h1">리더 대시보드</h1>
    <p className="soft">그룹 활동 · 교육 · 리더 후보 관리</p>
    <div className="statrow">
      <div className="st"><b>{ms.length}</b><span>그룹원</span></div>
      <div className="st"><b style={{color:risk?"#C0392B":undefined}}>{risk}</b><span>연락 필요</span></div>
      <div className="st"><b>{newb}</b><span>신입(3주내)</span></div>
      <div className="st"><b style={{color:"#6B4DE6"}}>{cand}</b><span>리더 후보</span></div>
    </div>
    {ms.length===0?(<div className="bigcard center">
      <p className="soft">아직 그룹원이 없어요.<br/>샘플로 먼저 보시거나 직접 추가하세요.</p>
      <button className="btn primary" onClick={seed}>샘플 그룹 넣기</button>
      <button className="btn ghost" onClick={()=>setAdding(true)}>직접 추가하기</button>
    </div>):(<React.Fragment>
      {risk>0&&<div className="hintbox">일주일 넘게 활동이 없는 분이 <b style={{textDecoration:"none"}}>{risk}명</b> 있어요. 먼저 연락해보세요.</div>}
      {ms.map(m=>(<div className="mem" key={m.id}>
        <div className="mem-top"><b>{m.name}</b>
          <span style={{display:"flex",gap:5}}>
            {m.newbie&&<span className="pill hot">신입 {m.joinDays}일차</span>}
            {m.candidate&&<span className="pill cand">리더 후보</span>}
            <span className={m.risk?"pill cold":"pill ok"}>{m.gap>900?"기록 없음":`${m.gap}일 전`}</span>
          </span></div>
        <div className="mem-s">{m.note}</div>
        <div className="mem-bars">
          <div><span>활동 {m.activity||0}</span><Bar v={m.activity||0} max={10} color="#1E5EFF"/></div>
          <div><span>교육 {m.lessons||0}과</span><Bar v={m.lessons||0} max={LESSON_TOTAL} color="#2E7D3A"/></div>
          <div><span>소개 {m.recruits||0}명</span><Bar v={m.recruits||0} max={6} color="#B07C10"/></div>
        </div>
        <div className="btn-row" style={{marginTop:11}}>
          <button className="mini" style={{flex:1}} onClick={()=>touch(m.id)}>연락했어요</button>
          <button className="mini" style={{flex:1}} onClick={()=>flip(m.id)}>{m.candidate?"후보 해제":"리더 후보로"}</button>
        </div>
      </div>))}
      <button className="btn ghost" onClick={()=>setAdding(true)}>+ 그룹원 추가</button>
    </React.Fragment>)}
    {adding&&(<div className="bigcard">
      <span className="eyebrow">새 그룹원</span>
      <input className="inp" placeholder="이름" value={nf.name} onChange={e=>setNf({...nf,name:e.target.value})}/>
      <input className="inp" placeholder="메모 (예: 이번 주 합류)" value={nf.note} onChange={e=>setNf({...nf,note:e.target.value})}/>
      <div className="btn-row">
        <button className="btn primary" disabled={!nf.name} onClick={()=>{
          save({...db,members:[...db.members,{id:uid(),name:nf.name,note:nf.note,joined:today(),
            lastActive:today(),activity:0,lessons:0,recruits:0,candidate:false}]});
          setNf({name:"",joined:today(),note:""});setAdding(false);notify("추가했어요");}}>추가</button>
        <button className="btn ghost" onClick={()=>setAdding(false)}>취소</button>
      </div>
    </div>)}
  </div>);
}

/* ======================= 기록 흐름 ======================= */
const EXAMPLE="오늘 성호헬스케어 김성호 사장님 만났어요. 직원이 스무 명인데 비용이 부담된다고 하셔서 샘플을 먼저 드리기로 했고, 대표님 승인이 필요하다고 하셨어요. 연락처는 010-2211-3344예요.";
function RecordFlow({db,commit,nav}){
  const [step,setStep]=useState(1);
  const [customerId,setCustomerId]=useState(null);
  const [selfOnly,setSelfOnly]=useState(false);
  const [mode,setMode]=useState("voice");
  const [text,setText]=useState(""); const [busy,setBusy]=useState(false);
  const [err,setErr]=useState(""); const [result,setResult]=useState(null); const [saved,setSaved]=useState(null);
  const cust=db.customers.find(c=>c.id===customerId);
  const analyze=async()=>{
    if(text.trim().length<15){setErr("조금만 더 자세히 남겨주세요.");return;}
    setBusy(true);setErr("");
    const hist=db.records.filter(r=>r.customerId===customerId).slice(0,4).map(r=>`- ${r.date}: ${r.summary}`).join("\n")||"없음";
    const weak=db.growth.weaknesses.filter(w=>w.count>=2).map(w=>`${w.tag} (${w.count}회)`).join(", ")||"없음";
    const objs=((cust&&cust.objections)||[]).map(o=>`${o.tag}(${o.count}회)`).join(", ")||"없음";
    const prompt=`당신은 따뜻하지만 정확한 한국 영업 코치입니다. 쉬운 말을 쓰세요.

[반복해온 약점] ${weak}
[상대 고객] ${cust?`${cust.name} (${cust.org}) · ${stageLabel(cust.stage)}`:"기록에서 파악하세요"}
[반복한 반대 이유] ${objs}
[지난 기록]
${hist}

[오늘 남긴 내용]
${text}

아래 JSON 하나만 출력. 백틱·설명 금지.
{"summary":"3~4줄 요약, 존댓말","customer":{"name":"","org":"","contact":"","orgSize":"","decisionMaker":"","category":"mineral|health|aicoach|chain","stage":"lead|consult|proposal|nego|won"},"praise":"잘한 점 하나, 2문장 이내","miss":"놓친 점 하나, 2문장 이내","betterScript":"다음에 쓸 실제 멘트 1~2문장","pattern":"반복 약점과 겹치면 한 문장, 없으면 빈 문자열","strengthTags":["5~12자"],"weaknessTags":["5~12자"],"cares":[],"objections":[],"works":[],"tasks":[{"title":"","channel":"전화|카카오톡|이메일|만나기","days":0,"kind":"promise|followup","script":"바로 보낼 멘트 2문장"}]}
tasks는 1~2개. 지어내지 마세요.`;
    try{ setResult(JSON.parse((await askClaude(prompt)).replace(/```json|```/g,"").trim())); setStep(4); }
    catch{ setResult(offlineAnalyze(text,cust)); setStep(4); }
    finally{setBusy(false);}
  };
  return (<div className="screen">
    {step<6&&(<div className="flowtop">
      <button className="back" onClick={()=>step===1?nav({n:"dash"}):setStep(step-1)}>← 뒤로</button>
      <div className="steps">{[1,2,3,4,5].map(n=><span key={n} className={n<=step?"d on":"d"}/>)}</div></div>)}
    {step===1&&(<React.Fragment>
      <h1 className="h1">누구를 만나셨어요?</h1>
      <div className="pick">
        {db.customers.map(c=>(<button key={c.id} className={customerId===c.id?"pk on":"pk"}
          onClick={()=>{setCustomerId(c.id);setSelfOnly(false);}}>
          <b>{c.name}</b><span>{c.org||CATS[c.category].label}</span></button>))}
        <button className={(customerId===null&&!selfOnly)?"pk on":"pk"} onClick={()=>{setCustomerId(null);setSelfOnly(false);}}>
          <b>+ 처음 만난 분</b><span>말하면 자동으로 등록돼요</span></button>
        <button className={selfOnly?"pk on":"pk"} onClick={()=>{setSelfOnly(true);setCustomerId(null);}}>
          <b>고객 만난 게 아니에요</b><span>혼자 한 일 기록하기</span></button>
      </div>
      <button className="btn primary" onClick={()=>setStep(2)}>다음</button>
    </React.Fragment>)}
    {step===2&&(<React.Fragment>
      <h1 className="h1">어떻게 남길까요?</h1>
      <button className="btn choose big" onClick={()=>{setMode("voice");setStep(3);}}>🎙 말하기<span>제일 편해요</span></button>
      <button className="btn choose" onClick={()=>{setMode("text");setStep(3);}}>✏️ 글로 쓰기</button>
    </React.Fragment>)}
    {step===3&&(<React.Fragment>
      <h1 className="h1">{mode==="voice"?"편하게 말씀하세요":"편하게 적어주세요"}</h1>
      <p className="soft">누구를 만나 무슨 이야기를 했는지, 순서 없이 말해도 괜찮아요.</p>
      {mode==="voice"&&<Dictation value={text} onText={setText}/>}
      <div className="hintbox">처음이신가요? <b onClick={()=>setText(EXAMPLE)}>예시 넣어보기</b>를 누르면 어떻게 되는지 바로 볼 수 있어요.</div>
      <textarea className="area" rows={mode==="voice"?7:10} value={text} onChange={e=>setText(e.target.value)}
        placeholder={mode==="voice"?"말씀하시면 여기에 적혀요. 틀린 곳은 고치셔도 됩니다.":"예) 오늘 김성호 사장님을 만났어요…"}/>
      {err&&<div className="err">{err}</div>}
      <button className="btn primary" onClick={analyze} disabled={busy}>{busy?"코치가 읽는 중이에요…":"다 됐어요"}</button>
    </React.Fragment>)}
    {step===4&&result&&(<React.Fragment>
      <h1 className="h1">이렇게 정리했어요.<br/>맞나요?</h1>
      <div className="bigcard"><p className="summary">{result.summary}</p>
        {result.customer&&result.customer.name&&(<div className="found">
          <span className="eyebrow">알아낸 고객 정보</span>
          <div>{result.customer.name}{result.customer.org?` · ${result.customer.org}`:""}</div>
          {result.customer.contact&&<div>{result.customer.contact}</div>}
          {result.customer.orgSize&&<div>규모: {result.customer.orgSize}</div>}
          {result.customer.decisionMaker&&<div>결정하시는 분: {result.customer.decisionMaker}</div>}
          {result.customer.category&&<div>분류: {CATS[result.customer.category].label}</div>}
        </div>)}</div>
      <button className="btn primary" onClick={()=>setStep(5)}>맞아요</button>
      <button className="btn ghost" onClick={()=>setStep(3)}>고칠게요</button>
    </React.Fragment>)}
    {step===5&&result&&(<React.Fragment>
      <h1 className="h1">코치가 봤어요</h1>
      {result.offline&&<span className="offline">간단 코칭 모드</span>}
      <div className="speakrow"><button className="speak"
        onClick={()=>speak(`잘하셨어요. ${result.praise} 이건 놓치셨어요. ${result.miss} 다음엔 이렇게 말해보세요. ${result.betterScript}`)}>🔊 읽어주기</button></div>
      <div className="coach c-good"><div className="ch">👏 잘하셨어요</div><p>{result.praise}</p></div>
      <div className="coach c-miss"><div className="ch">🔍 이건 놓치셨어요</div><p>{result.miss}</p></div>
      <div className="coach c-say"><div className="ch">💬 다음엔 이렇게 말해보세요</div><p className="quote">{result.betterScript}</p></div>
      {result.pattern&&<div className="coach c-pat"><div className="ch">📌 눈여겨볼 점</div><p>{result.pattern}</p></div>}
      <button className="btn primary" onClick={()=>{setSaved(commit({customerId,rawText:text,summary:result.summary,result,mode}));setStep(6);}}>
        미션 {(result.tasks||[]).length}개 받기</button>
    </React.Fragment>)}
    {step===6&&saved&&(<div className="done">
      <div className="big-emo">✓</div>
      <h1 className="h1">{saved.streak}일째 기록하셨어요 🔥</h1>
      <p className="soft">오늘의 미션에 {saved.taskCount}개가 들어갔어요.</p>
      {saved.focus&&(<div className="focusbox"><span className="eyebrow">이달의 집중 과제</span>
        <b>{saved.focus.tag}</b><span className="soft">{saved.focus.count}번 반복됐어요</span></div>)}
      <button className="btn primary" onClick={()=>nav({n:"dash"})}>홈으로</button>
    </div>)}
  </div>);
}

function Dictation({value,onText}){
  const d=useDictation(onText);
  const [sec,setSec]=useState(0); const tm=useRef(null);
  useEffect(()=>{ if(d.on){setSec(0);tm.current=setInterval(()=>setSec(x=>x+1),1000);} else clearInterval(tm.current);
    return ()=>clearInterval(tm.current); },[d.on]);
  const mm=`${String(Math.floor(sec/60)).padStart(2,"0")}:${String(sec%60).padStart(2,"0")}`;
  return (<div className={d.on?"dict live":"dict"}>
    <button className={d.on?"micbig on":"micbig"} onClick={()=>d.on?d.stop():d.start(value)}>{d.on?"■":"🎙"}</button>
    <div className="dict-t">{d.on?`듣고 있어요  ${mm}`:"눌러서 말하기"}</div>
    <div className={d.on?"dict-s live":"dict-s"}>
      {d.on?"말씀하시면 아래에 글로 적혀요 · 다 하시면 다시 누르세요":"버튼을 누르고 편하게 말씀하세요"}</div>
    {d.on&&<div className="wave"><i/><i/><i/><i/><i/><i/></div>}
    {d.on&&d.interim&&<div className="interim">{d.interim}</div>}
    {d.err&&<div className="err" style={{marginTop:12,marginBottom:0}}>{d.err}</div>}
  </div>);
}

/* ========================== 나 ========================== */
function Me({db,reset,nav}){
  const focus=db.growth.weaknesses.find(w=>w.focus);
  const st=[...db.growth.strengths].sort((a,b)=>b.count-a.count).slice(0,5);
  const wk=[...db.growth.weaknesses].sort((a,b)=>b.count-a.count).slice(0,5);
  const month=db.records.filter(r=>r.date.slice(0,7)===today().slice(0,7)).length;
  const rate=db.tasks.length?Math.round(db.tasks.filter(t=>t.done).length/db.tasks.length*100):0;
  const perCat=CATKEYS.map(k=>({k,n:db.customers.filter(c=>c.category===k).length}));
  const max=Math.max(1,...perCat.map(p=>p.n));
  return (<div className="screen">
    <h1 className="h1">나의 성장</h1>
    <div className="statrow">
      <div className="st"><b>🔥 {db.user.streak}</b><span>연속 기록</span></div>
      <div className="st"><b>{month}</b><span>이번 달</span></div>
      <div className="st"><b>{rate}%</b><span>미션 완료</span></div>
      <div className="st"><b>{db.learned.length}</b><span>교육 이수</span></div>
    </div>
    {focus?(<div className="bigcard focus"><span className="eyebrow">이달의 집중 과제</span>
      <h2 className="task-title">{focus.tag}</h2>
      <p className="soft">{focus.count}번 반복해서 나왔어요. 이것만 고쳐도 크게 달라져요.</p></div>
    ):(<div className="bigcard"><p className="soft" style={{margin:0}}>같은 점이 {FOCUS_THRESHOLD}번 쌓이면 AI가 집중 과제를 정해드려요.</p></div>)}
    <div className="h2">카테고리별 고객</div>
    <div className="bigcard">
      {perCat.map(p=>(<div key={p.k} style={{display:"flex",alignItems:"center",gap:10,margin:"9px 0"}}>
        <span style={{width:76,fontSize:13.5,fontWeight:700,color:"#4A5665"}}>{CATS[p.k].label}</span>
        <span className="prog" style={{marginTop:0}}><i style={{width:`${p.n/max*100}%`,background:CATS[p.k].color}}/></span>
        <b style={{width:22,textAlign:"right",fontSize:15}}>{p.n}</b></div>))}
    </div>
    {st.length>0&&(<React.Fragment><div className="h2">잘하고 계신 것</div>
      <div className="tags">{st.map(s=><span className="tag good" key={s.tag}>{s.tag}{s.count>1&&<i> {s.count}</i>}</span>)}</div></React.Fragment>)}
    {wk.length>0&&(<React.Fragment><div className="h2">더 좋아질 수 있는 것</div>
      <div className="tags">{wk.map(s=><span className="tag bad" key={s.tag}>{s.tag}{s.count>1&&<i> {s.count}</i>}</span>)}</div></React.Fragment>)}
    <button className="resetbtn" onClick={reset}>기록 전부 지우기</button>
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
